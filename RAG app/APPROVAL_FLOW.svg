<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1140" viewBox="0 0 1080 1140" role="img" aria-labelledby="title desc">
<title id="title">Review · Inspect → decide → publish</title><desc id="desc">Human review controls which captured version chat may use. Latest capture and active evidence are different: a pending download cannot answer chat.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#7b8ca4" stroke-width="1.5"/></marker></defs>
<rect width="1080" height="1140" fill="#f6f8fc"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#172b43">
<text x="52" y="60" font-size="29" font-weight="700">Review · Inspect → decide → publish</text>
<text x="52" y="94" font-size="17" fill="#52637b">Human review controls which captured version chat may use.</text>
<rect x="52" y="130" width="976" height="105" rx="15" fill="white" stroke="#d9e1ed"/>
<circle cx="88" cy="167" r="19" fill="#233e65"/>
<text x="88" y="173" font-size="17" text-anchor="middle" fill="white" font-weight="700">1</text>
<text x="123" y="165" font-size="20" font-weight="700">Read the captured document</text>
<text x="123" y="195" font-size="16" fill="#52637b">Overview, Document and Changes read saved records</text>
<rect x="123" y="206" width="71" height="21" rx="7" fill="#e4f5f0"/>
<text x="134" y="221" font-size="11" font-weight="700">DB READ</text>
<path d="M540 237V254" stroke="#7b8ca4" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="52" y="262" width="976" height="105" rx="15" fill="white" stroke="#d9e1ed"/>
<circle cx="88" cy="299" r="19" fill="#233e65"/>
<text x="88" y="305" font-size="17" text-anchor="middle" fill="white" font-weight="700">2</text>
<text x="123" y="297" font-size="20" font-weight="700">Choose Approve or Reject</text>
<text x="123" y="327" font-size="16" fill="#52637b">React → POST /knowledge/versions/{id}/review</text>
<rect x="123" y="338" width="78" height="21" rx="7" fill="#e9efff"/>
<text x="134" y="353" font-size="11" font-weight="700">UI → API</text>
<path d="M540 369V386" stroke="#7b8ca4" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="52" y="394" width="976" height="105" rx="15" fill="white" stroke="#d9e1ed"/>
<circle cx="88" cy="431" r="19" fill="#233e65"/>
<text x="88" y="437" font-size="17" text-anchor="middle" fill="white" font-weight="700">3</text>
<text x="123" y="429" font-size="20" font-weight="700">Validate the review</text>
<text x="123" y="459" font-size="16" fill="#52637b">SyncService.review: pending/latest; approval checks indexes</text>
<rect x="123" y="470" width="141" height="21" rx="7" fill="#eef2f6"/>
<text x="134" y="485" font-size="11" font-weight="700">SERVICE + DB READ</text>
<path d="M540 501V518" stroke="#7b8ca4" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="52" y="526" width="976" height="105" rx="15" fill="white" stroke="#d9e1ed"/>
<circle cx="88" cy="563" r="19" fill="#233e65"/>
<text x="88" y="569" font-size="17" text-anchor="middle" fill="white" font-weight="700">4</text>
<text x="123" y="561" font-size="20" font-weight="700">Save decision together in a transaction</text>
<text x="123" y="591" font-size="16" fill="#52637b">KnowledgeRepository.review updates version and change record</text>
<rect x="123" y="602" width="78" height="21" rx="7" fill="#e4f5f0"/>
<text x="134" y="617" font-size="11" font-weight="700">DB WRITE</text>
<path d="M540 633V650" stroke="#7b8ca4" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="52" y="658" width="976" height="105" rx="15" fill="white" stroke="#d9e1ed"/>
<circle cx="88" cy="695" r="19" fill="#233e65"/>
<text x="88" y="701" font-size="17" text-anchor="middle" fill="white" font-weight="700">5</text>
<text x="123" y="693" font-size="20" font-weight="700">On approval: switch the active pointer</text>
<text x="123" y="723" font-size="16" fill="#52637b">sources.active_version_id → approved document version</text>
<rect x="123" y="734" width="78" height="21" rx="7" fill="#e4f5f0"/>
<text x="134" y="749" font-size="11" font-weight="700">DB WRITE</text>
<path d="M540 765V782" stroke="#7b8ca4" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="52" y="790" width="976" height="105" rx="15" fill="white" stroke="#d9e1ed"/>
<circle cx="88" cy="827" r="19" fill="#233e65"/>
<text x="88" y="833" font-size="17" text-anchor="middle" fill="white" font-weight="700">6</text>
<text x="123" y="825" font-size="20" font-weight="700">Next chat retrieves the approved version</text>
<text x="123" y="855" font-size="16" fill="#52637b">Reject keeps the existing active pointer unchanged</text>
<rect x="123" y="866" width="99" height="21" rx="7" fill="#eef2f6"/>
<text x="134" y="881" font-size="11" font-weight="700">RAG DB READ</text>
<text x="52" y="965" font-size="15" fill="#52637b">Review makes no OpenAI calls and no web-search calls.</text>
<rect x="52" y="990" width="976" height="106" rx="15" fill="#e8eef7"/>
<text x="72" y="1019" font-size="13" font-weight="700">WHAT TO REMEMBER</text>
<text x="72" y="1043" font-size="14">DB writes: document_versions review dates/status, change_records decision; source pointer on approve.</text>
<text x="72" y="1063" font-size="14">Latest capture and active evidence are different: a pending download cannot answer chat.</text>
</g></svg>