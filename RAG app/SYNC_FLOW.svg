<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1140" viewBox="0 0 1080 1140" role="img" aria-labelledby="title desc">
<title id="title">Sync · Fetch → prepare → stage</title><desc id="desc">Only clicking Sync starts collection. Discovery is optional. Sync does not publish evidence. Chat continues using the previously approved version.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#7b8ca4" stroke-width="1.5"/></marker></defs>
<rect width="1080" height="1140" fill="#f6f8fc"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#172b43">
<text x="52" y="60" font-size="29" font-weight="700">Sync · Fetch → prepare → stage</text>
<text x="52" y="94" font-size="17" fill="#52637b">Only clicking Sync starts collection. Discovery is optional.</text>
<rect x="52" y="130" width="976" height="105" rx="15" fill="white" stroke="#d9e1ed"/>
<circle cx="88" cy="167" r="19" fill="#233e65"/>
<text x="88" y="173" font-size="17" text-anchor="middle" fill="white" font-weight="700">1</text>
<text x="123" y="165" font-size="20" font-weight="700">Click Sync</text>
<text x="123" y="195" font-size="16" fill="#52637b">React → POST /knowledge/sync → SyncService.start</text>
<rect x="123" y="206" width="36" height="21" rx="7" fill="#e9efff"/>
<text x="134" y="221" font-size="11" font-weight="700">UI</text>
<path d="M540 237V254" stroke="#7b8ca4" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="52" y="262" width="976" height="105" rx="15" fill="white" stroke="#d9e1ed"/>
<circle cx="88" cy="299" r="19" fill="#233e65"/>
<text x="88" y="305" font-size="17" text-anchor="middle" fill="white" font-weight="700">2</text>
<text x="123" y="297" font-size="20" font-weight="700">Save job and start worker</text>
<text x="123" y="327" font-size="16" fill="#52637b">MongoDB update_runs → Azure starts worker with job ID</text>
<rect x="123" y="338" width="134" height="21" rx="7" fill="#e4f5f0"/>
<text x="134" y="353" font-size="11" font-weight="700">DB WRITE + AZURE</text>
<path d="M540 369V386" stroke="#7b8ca4" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="52" y="394" width="976" height="105" rx="15" fill="white" stroke="#d9e1ed"/>
<circle cx="88" cy="431" r="19" fill="#233e65"/>
<text x="88" y="437" font-size="17" text-anchor="middle" fill="white" font-weight="700">3</text>
<text x="123" y="429" font-size="20" font-weight="700">Optionally discover more official URLs</text>
<text x="123" y="459" font-size="16" fill="#52637b">If checked: OfficialDiscovery → domain-filtered web_search</text>
<rect x="123" y="470" width="141" height="21" rx="7" fill="#f0eafe"/>
<text x="134" y="485" font-size="11" font-weight="700">OPENAI WEB SEARCH</text>
<path d="M540 501V518" stroke="#7b8ca4" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="52" y="526" width="976" height="105" rx="15" fill="white" stroke="#d9e1ed"/>
<circle cx="88" cy="563" r="19" fill="#233e65"/>
<text x="88" y="569" font-size="17" text-anchor="middle" fill="white" font-weight="700">4</text>
<text x="123" y="561" font-size="20" font-weight="700">Download and compare official content</text>
<text x="123" y="591" font-size="16" fill="#52637b">SourceFetcher → HTTPS → extract text → compare fingerprint</text>
<rect x="123" y="602" width="141" height="21" rx="7" fill="#fff1de"/>
<text x="134" y="617" font-size="11" font-weight="700">WEB FETCH + LOCAL</text>
<path d="M540 633V650" stroke="#7b8ca4" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="52" y="658" width="976" height="105" rx="15" fill="white" stroke="#d9e1ed"/>
<circle cx="88" cy="695" r="19" fill="#233e65"/>
<text x="88" y="701" font-size="17" text-anchor="middle" fill="white" font-weight="700">5</text>
<text x="123" y="693" font-size="20" font-weight="700">Prepare changed evidence</text>
<text x="123" y="723" font-size="16" fill="#52637b">Chunk → reuse/embed missing text → summarize changes</text>
<rect x="123" y="734" width="141" height="21" rx="7" fill="#f0eafe"/>
<text x="134" y="749" font-size="11" font-weight="700">OPENAI + DB WRITE</text>
<path d="M540 765V782" stroke="#7b8ca4" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="52" y="790" width="976" height="105" rx="15" fill="white" stroke="#d9e1ed"/>
<circle cx="88" cy="827" r="19" fill="#233e65"/>
<text x="88" y="833" font-size="17" text-anchor="middle" fill="white" font-weight="700">6</text>
<text x="123" y="825" font-size="20" font-weight="700">Stage for review and finish job</text>
<text x="123" y="855" font-size="16" fill="#52637b">Save pending version, original file and source/job outcomes</text>
<rect x="123" y="866" width="78" height="21" rx="7" fill="#e4f5f0"/>
<text x="134" y="881" font-size="11" font-weight="700">DB WRITE</text>
<text x="52" y="965" font-size="15" fill="#52637b">Unchanged content: update freshness/job outcome; skip new embeddings and summary.</text>
<rect x="52" y="990" width="976" height="106" rx="15" fill="#e8eef7"/>
<text x="72" y="1019" font-size="13" font-weight="700">WHAT TO REMEMBER</text>
<text x="72" y="1043" font-size="14">DB writes: sources, update_runs, chunks, document_versions, change_records and GridFS.</text>
<text x="72" y="1063" font-size="14">Sync does not publish evidence. Chat continues using the previously approved version.</text>
</g></svg>