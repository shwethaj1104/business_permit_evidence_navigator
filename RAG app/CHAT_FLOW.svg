<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1480" viewBox="0 0 1080 1480" role="img" aria-labelledby="title desc">
<title id="title">Chat · Ask → retrieve → answer</title><desc id="desc">Chat reads approved evidence. It never searches the web. If scope/profile/evidence is missing, return a refusal, questions or gap instead.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#7b8ca4" stroke-width="1.5"/></marker></defs>
<rect width="1080" height="1480" fill="#f6f8fc"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#172b43">
<text x="52" y="40" font-size="23" font-weight="700">Before chat: prepare first, approve second</text>
<rect x="52" y="62" width="976" height="112" rx="15" fill="#e8eefb" stroke="#d1dced"/>
<text x="72" y="90" font-size="18" font-weight="700">DURING SYNC · Create the evidence</text>
<text x="72" y="119" font-size="16">Fetch document → split text → create/reuse embeddings → save multiple chunks.</text>
<text x="72" y="146" font-size="16">document_versions: full text + pending status. chunks: passages share the same version_id.</text>
<rect x="52" y="190" width="976" height="112" rx="15" fill="#e4f5ef" stroke="#c8e5d8"/>
<text x="72" y="218" font-size="18" font-weight="700">DURING APPROVAL · Activate existing evidence</text>
<text x="72" y="247" font-size="16">Mark document_versions.status = approved; set sources.active_version_id = version ID.</text>
<text x="72" y="274" font-size="16">No new chunking or embeddings. Existing chunks for that version become eligible for chat.</text>
</g>
<g font-family="Arial, Helvetica, sans-serif" fill="#172b43">
<g transform="translate(0 340)"><text x="52" y="60" font-size="29" font-weight="700">Chat · Ask → retrieve → answer</text>
<text x="52" y="94" font-size="17" fill="#52637b">Chat reads approved evidence. It never searches the web.</text>
<rect x="52" y="130" width="976" height="105" rx="15" fill="white" stroke="#d9e1ed"/>
<circle cx="88" cy="167" r="19" fill="#233e65"/>
<text x="88" y="173" font-size="17" text-anchor="middle" fill="white" font-weight="700">1</text>
<text x="123" y="165" font-size="20" font-weight="700">Send your question</text>
<text x="123" y="195" font-size="16" fill="#52637b">React → chatApi → POST /api/v1/chat</text>
<rect x="123" y="206" width="36" height="21" rx="7" fill="#e9efff"/>
<text x="134" y="221" font-size="11" font-weight="700">UI</text>
<path d="M540 237V254" stroke="#7b8ca4" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="52" y="262" width="976" height="105" rx="15" fill="white" stroke="#d9e1ed"/>
<circle cx="88" cy="299" r="19" fill="#233e65"/>
<text x="88" y="305" font-size="17" text-anchor="middle" fill="white" font-weight="700">2</text>
<text x="123" y="297" font-size="20" font-weight="700">Check scope and business profile</text>
<text x="123" y="327" font-size="16" fill="#52637b">ChatController → ChatService.send</text>
<rect x="123" y="338" width="71" height="21" rx="7" fill="#eef2f6"/>
<text x="134" y="353" font-size="11" font-weight="700">SERVICE</text>
<path d="M540 369V386" stroke="#7b8ca4" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="52" y="394" width="976" height="105" rx="15" fill="white" stroke="#d9e1ed"/>
<circle cx="88" cy="431" r="19" fill="#233e65"/>
<text x="88" y="437" font-size="17" text-anchor="middle" fill="white" font-weight="700">3</text>
<text x="123" y="429" font-size="20" font-weight="700">Find approved evidence · RETRIEVAL</text>
<text x="123" y="459" font-size="16" fill="#52637b">Embed question → MongoDB vector + keyword search</text>
<rect x="123" y="470" width="134" height="21" rx="7" fill="#f0eafe"/>
<text x="134" y="485" font-size="11" font-weight="700">OPENAI + DB READ</text>
<path d="M540 501V518" stroke="#7b8ca4" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="52" y="526" width="976" height="105" rx="15" fill="white" stroke="#d9e1ed"/>
<circle cx="88" cy="563" r="19" fill="#233e65"/>
<text x="88" y="569" font-size="17" text-anchor="middle" fill="white" font-weight="700">4</text>
<text x="123" y="561" font-size="20" font-weight="700">Add evidence to the prompt · AUGMENTATION</text>
<text x="123" y="591" font-size="16" fill="#52637b">Profile + question + up to 8 passages + recent history</text>
<rect x="123" y="602" width="57" height="21" rx="7" fill="#eef2f6"/>
<text x="134" y="617" font-size="11" font-weight="700">LOCAL</text>
<path d="M540 633V650" stroke="#7b8ca4" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="52" y="658" width="976" height="105" rx="15" fill="white" stroke="#d9e1ed"/>
<circle cx="88" cy="695" r="19" fill="#233e65"/>
<text x="88" y="701" font-size="17" text-anchor="middle" fill="white" font-weight="700">5</text>
<text x="123" y="693" font-size="20" font-weight="700">Generate a cited answer · GENERATION</text>
<text x="123" y="723" font-size="16" fill="#52637b">LanguageModel.answer → OpenAI structured response</text>
<rect x="123" y="734" width="64" height="21" rx="7" fill="#f0eafe"/>
<text x="134" y="749" font-size="11" font-weight="700">OPENAI</text>
<path d="M540 765V782" stroke="#7b8ca4" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="52" y="790" width="976" height="105" rx="15" fill="white" stroke="#d9e1ed"/>
<circle cx="88" cy="827" r="19" fill="#233e65"/>
<text x="88" y="833" font-size="17" text-anchor="middle" fill="white" font-weight="700">6</text>
<text x="123" y="825" font-size="20" font-weight="700">Validate, save and display</text>
<text x="123" y="855" font-size="16" fill="#52637b">Validate citations → save exchange → render AnswerCard</text>
<rect x="123" y="866" width="78" height="21" rx="7" fill="#e4f5f0"/>
<text x="134" y="881" font-size="11" font-weight="700">DB WRITE</text>
<text x="52" y="965" font-size="15" fill="#52637b">Before retrieval: known greetings need no LLM. Other messages may use an intent LLM call.</text>
<rect x="52" y="990" width="976" height="106" rx="15" fill="#e8eef7"/>
<text x="72" y="1019" font-size="13" font-weight="700">WHAT TO REMEMBER</text>
<text x="72" y="1043" font-size="14">DB writes: conversations metadata + 2 conversation_messages (user and assistant).</text>
<text x="72" y="1063" font-size="14">If scope/profile/evidence is missing, return a refusal, questions or gap instead.</text>
</g></g></svg>