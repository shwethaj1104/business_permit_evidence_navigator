[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "permit-navigator"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1", "pymongo>=4.10,<5", "openai>=1.99,<3", "python-dotenv>=1,<2", "httpx>=0.28,<1", "beautifulsoup4>=4.12,<5", "pypdf>=5,<7"]

[project.optional-dependencies]
azure = ["azure-identity>=1.19,<2"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "mongomock>=4.3,<5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
