name: Backend checks and deployment
on:
  pull_request:
    branches: [main]
    paths: ['RAG app/backend/**', '.github/workflows/backend.yml']
  push:
    branches: [main]
    paths: ['RAG app/backend/**', '.github/workflows/backend.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RAG app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install uv==0.13.0
      - run: uv sync --frozen --extra dev --extra azure
      - run: uv run --frozen --extra dev ruff check --no-cache app scripts tests
      - run: uv run --frozen --extra dev ruff format --check app scripts tests
      - run: uv run --frozen --extra dev pytest -q
      - uses: docker/setup-buildx-action@v3
      - name: Validate runtime image
        uses: docker/build-push-action@v6
        with:
          context: RAG app/backend
          load: true
          tags: permit-backend:check
      - name: Smoke-test installed runtime and one-shot CLI
        run: |
          docker run --rm permit-backend:check python -c 'from app.main import app; from azure.identity import ManagedIdentityCredential; assert app'
          docker run --rm permit-backend:check python -m app.workers.sync_worker --help
  publish:
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - id: image
        name: Choose immutable image tag
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/permit-navigator-backend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: RAG app/backend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}
  deploy:
    needs: publish
    if: vars.AZURE_DEPLOY_ENABLED == 'true'
    environment: azure-demo
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Update worker and API to the same release
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          API_NAME: ${{ vars.AZURE_API_APP_NAME }}
          WORKER_NAME: ${{ vars.AZURE_WORKER_JOB_NAME }}
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          test -n "$RESOURCE_GROUP" && test -n "$API_NAME" && test -n "$WORKER_NAME"
          az extension add --name containerapp --upgrade
          az containerapp job update --resource-group "$RESOURCE_GROUP" --name "$WORKER_NAME" --image "$IMAGE"
          az containerapp update --resource-group "$RESOURCE_GROUP" --name "$API_NAME" --image "$IMAGE"
